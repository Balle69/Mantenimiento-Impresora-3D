  <meta charset="UTF-8">

  <meta name="description" content="App de Mantenimiento 3D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PrintCare 3D">

  <title>PrintCare 3D</title>
  <link rel="manifest" href="manifest.json">

  <!-- Script para evitar que la caché bloquee la app -->
  <script>
    // Limpia el service worker antiguo que puede estar causando la pantalla blanca
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</head>

</body>
